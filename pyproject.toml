[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-sniffer-traffic-analyzer"
version = "1.0.0"
description = "Metadata-first defensive packet and traffic analysis"
requires-python = ">=3.10"
dependencies = ["scapy>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
traffic-analyzer = "traffic_analyzer:main"
